[package]
name = "ink-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = "0.34.3"
env_logger = "0.11.10"
glam = "0.33.0"
# Decodificar las texturas de material (JPG CC0) y el icono de la app (PNG) para la GPU/ventana.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ink-core = { version = "0.1.0", path = "../ink-core" }
ink-brush = { version = "0.1.0", path = "../ink-brush" }
log = "0.4.30"
pollster = "0.4.0"
# Dialogos nativos de archivo (Guardar como / Abrir) para exportar e importar cuadernos entre PCs.
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29.0.3"
winit = "0.30.13"

# Solo en Windows: leer el boton "barrel" del lapiz via la API de puntero (WM_POINTER),
# igual que Photoshop, ya que winit no expone los botones del stylus.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dwm",
] }

# Solo en Windows: incrustar el icono de la app en el .exe (Explorer, barra de tareas).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
