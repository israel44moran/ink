[package]
name = "ink-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = "0.34.3"
env_logger = "0.11.10"
glam = "0.33.0"
ink-core = { version = "0.1.0", path = "../ink-core" }
ink-brush = { version = "0.1.0", path = "../ink-brush" }
log = "0.4.30"
pollster = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29.0.3"
winit = "0.30.13"

# Solo en Windows: leer el boton "barrel" del lapiz via la API de puntero (WM_POINTER),
# igual que Photoshop, ya que winit no expone los botones del stylus.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_Pointer",
] }
